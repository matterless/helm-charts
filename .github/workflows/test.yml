name: Lint and Test Charts

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # https://github.com/kubernetes-sigs/kind/releases
        kind_version: [v0.30.0]
        k8s_version: [v1.34.0, v1.33.4, v1.32.8, v1.31.12]
        include:
          - kind_version: v0.22.0
            k8s_version: v1.29.2
          - kind_version: v0.22.0
            k8s_version: v1.23.17
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Check Cactus public configuration
        run: python3 -m unittest discover -s tests -p 'test_cactus_public_config.py'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2
        with:
          yamale_version: 6.0.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed="$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})"
          echo "$changed"
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "charts<<EOF"
              echo "$changed"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        uses: helm/kind-action@v1
        if: steps.list-changed.outputs.changed == 'true'
        with:
          version: ${{ matrix.kind_version }}
          node_image: kindest/node:${{ matrix.k8s_version }}
          kubectl_version: ${{ matrix.k8s_version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MATTERLESS_COMMON_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.MATTERLESS_COMMON_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.MATTERLESS_COMMON_AWS_REGION }}

      # Pre-install scripts rewrite values.yaml (ECR pull secret, CI secrets). Running
      # them for every chart dirties the worktree so a later `ct install` treats
      # unrelated charts as changed and installs them. Only prepare changed charts,
      # and pass those paths explicitly to `ct install --charts`.
      - name: Run pre-install scripts
        if: steps.list-changed.outputs.changed == 'true'
        env:
          AUTH_JWT_PROFILE: ${{ secrets.AUTH_JWT_PROFILE }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          while IFS= read -r chart; do
            [[ -z "$chart" ]] && continue
            script="${chart}/scripts/pre-install.sh"
            if [[ -f "$script" ]]; then
              echo "--- Executing: $script ---"
              bash "$script"
            fi
          done <<< "${{ steps.list-changed.outputs.charts }}"

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          # Workaround for https://github.com/helm/chart-testing/issues/655
          repos="$(yq '.dependencies[] | select(.repository != null) | "\(.name)=\(.repository)"' charts/*/Chart.yaml)"
          repo_args="$(echo "$repos" | sed '/^=$/d' | sort -t = -k 2 -u | awk '{printf "%s,", $0}' | sed 's/,$//')"
          test -n "$repo_args" && chart_repos="--chart-repos $repo_args" || chart_repos=""

          charts_args=()
          while IFS= read -r chart; do
            [[ -z "$chart" ]] && continue
            charts_args+=(--charts "$chart")
          done <<< "${{ steps.list-changed.outputs.charts }}"

          ct install \
            --target-branch "${{ github.event.repository.default_branch }}" \
            "${charts_args[@]}" \
            $chart_repos
