apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "store-analyzer.fullname" . }}-test-connection"
  labels:
    {{- include "store-analyzer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl
      command: ['curl']
      args: ['-f', 'http://{{ include "store-analyzer.fullname" . }}:{{ .Values.service.port }}/healthz']
  restartPolicy: Never
